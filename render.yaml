services:
  - type: web
    name: personal-finance-advisor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: personal-finance-advisor-db
          property: connectionString

databases:
  - name: personal-finance-advisor-db
    databaseName: finance
    user: finance_user
