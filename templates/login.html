<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In - Personal Finance Advisor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Inter, Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
            padding: 24px;
        }

        .auth-card {
            background: #ffffff;
            border: 1px solid #e5eaf2;
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 18px 50px rgba(23, 32, 51, 0.10);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            border-radius: 16px;
            background: #2563eb;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 27px;
        }

        .subtitle {
            margin: 0;
            color: #718096;
            font-size: 14px;
        }

        .error {
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #fff0f0;
            color: #b42318;
            border: 1px solid #ffd0d0;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        .field {
            margin-bottom: 18px;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #d8dee9;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            color: #172033;
            background: #fff;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        button {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .bottom {
            margin-top: 22px;
            text-align: center;
            color: #718096;
            font-size: 14px;
        }

        a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="auth-container">
    <div class="auth-card">

        <div class="brand">
            <div class="brand-icon">₹</div>
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to your finance dashboard</p>
        </div>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="field">
                <label for="email">Email</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                    required
                    autofocus
                    value="{{ request.form.get('email', '') }}"
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit">
                Sign In
            </button>

        </form>

        <div class="bottom">
            Don't have an account?
            <a href="{{ url_for('signup') }}">Create account</a>
        </div>

    </div>
</div>

</body>
</html>
