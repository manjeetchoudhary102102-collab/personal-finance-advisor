    <!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Initial Setup - Personal Finance Advisor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Inter, Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .container {
            width: 100%;
            max-width: 460px;
            padding: 24px;
        }

        .card {
            background: #fff;
            border: 1px solid #e5eaf2;
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 18px 50px rgba(23, 32, 51, 0.10);
        }

        .icon {
            width: 62px;
            height: 62px;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: #2563eb;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            margin: 0 0 24px;
            color: #718096;
            font-size: 14px;
            line-height: 1.6;
        }

        .notice {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            border-radius: 10px;
            padding: 13px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.5;
        }

        .error {
            background: #fff0f0;
            color: #b42318;
            border: 1px solid #ffd0d0;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #d8dee9;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        }

        button {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <div class="icon">₹</div>

        <h1>Initial Setup</h1>

        <p class="subtitle">
            Create the first administrator account for your
            Personal Finance Advisor.
        </p>

        <div class="notice">
            The first account created here will have
            <strong>Administrator</strong> privileges.
        </div>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="field">
                <label for="name">Administrator Name</label>
                <input
                    id="name"
                    name="name"
                    type="text"
                    required
                    autofocus
                    value="{{ request.form.get('name', '') }}"
                >
            </div>

            <div class="field">
                <label for="email">Administrator Email</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    required
                    value="{{ request.form.get('email', '') }}"
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    minlength="8"
                    required
                >
            </div>

            <div class="field">
                <label for="confirm_password">Confirm Password</label>
                <input
                    id="confirm_password"
                    name="confirm_password"
                    type="password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit">
                Create Administrator
            </button>

        </form>

    </div>
</div>

</body>
</html>
